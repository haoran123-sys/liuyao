<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="zhaohaoran（浩然老师）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' fill='%23FFFFFF' stroke='%23161616' stroke-width='6'/%3E%3Cpath d='M20 38h60M20 62h60' stroke='%23161616' stroke-width='7'/%3E%3C/svg%3E">
<title>浩然老师六爻排盘</title>
<style>
:root{
  --ink:#161616; --ink2:#4A4A4A; --muted:#8C8C8C;
  --line:#E8E8E8; --line2:#CFCFCF; --soft:#FAFAFA; --red:#B3261E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#fff;color:var(--ink);-webkit-text-size-adjust:100%;
}
.wrap{max-width:700px;margin:0 auto;padding:26px 18px 0}

/* 标题 */
h1{font-size:22px;font-weight:700;letter-spacing:4px;text-align:center}
.sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-align:center;margin-top:7px}
.hr{height:1px;background:var(--line2);margin:16px 0 0}

/* 段落标题 */
.sec{margin-top:18px}
.sec-h{font-size:11.5px;color:var(--muted);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 输入 */
.ctrl{margin-top:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.field{min-width:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
input,select{
  width:100%;height:42px;border:1px solid var(--line2);border-radius:3px;background:#fff;
  color:var(--ink);font-size:16px;font-family:inherit;padding:0 8px;text-align:center;
  -webkit-appearance:none;appearance:none;
}
select{text-align:left}
input:focus,select:focus{outline:none;border-color:var(--ink)}

/* 干支 */
.gz{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.gz-i{display:flex;flex-direction:column;gap:3px;min-width:0}
.gz-i b{font-size:16px;font-weight:600;letter-spacing:1px}
.gz-i span{font-size:10.5px;color:var(--muted);letter-spacing:1px}

/* 摇币 */
.coin-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;border:1px solid var(--line);border-radius:4px;padding:14px}
.coins{display:flex;gap:10px}
.coin{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink);
  user-select:none;transition:background .15s,color .15s,border-color .15s;
}
.coin.bei{background:var(--ink);color:#fff;border-color:var(--ink)}
.coin.spin{animation:spin .55s ease}
@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.coin-info{flex:1 1 180px;min-width:0}
.coin-line1{font-size:13px;color:var(--ink2);letter-spacing:.5px}
.coin-line2{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.coin-acts{display:flex;gap:8px;align-items:center}

/* 按钮 */
.btn{
  height:42px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-size:15px;font-family:inherit;letter-spacing:3px;border-radius:3px;cursor:pointer;
}
.btn:hover{background:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--ink2);border-color:var(--line2);letter-spacing:1px}
.btn-ghost:hover{background:var(--soft);color:var(--ink)}
.btn-main{width:100%;height:46px;font-size:16px;letter-spacing:8px;margin-top:12px}

/* 手动画爻 */
.yao-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.yp{display:flex;flex-direction:column;gap:3px;min-width:0}
.yp label{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:1px}
.yp select{height:38px;font-size:13px;padding:0 2px;text-align:center}

/* 结果 */
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px;border-top:1px solid var(--line)}
.info div{display:flex;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.info div span{font-size:11px;color:var(--muted);letter-spacing:1px;flex:0 0 auto}
.info div b{font-size:14px;font-weight:600;letter-spacing:.5px}

.gua-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.gua-grid.one{grid-template-columns:1fr}
.gua-note{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.5px}
.gua{border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.gua-h{padding:10px 12px 9px;border-bottom:1px solid var(--line);position:relative;text-align:center}
.gua-h .gt{position:absolute;left:12px;top:11px;font-size:10.5px;color:var(--muted);letter-spacing:2px}
.gua-h .gn{font-family:"Songti SC","STSong","SimSun",serif;font-size:17px;font-weight:700;letter-spacing:1px}
.gua-b{padding:8px 10px 10px}
.gua-sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px}

/* 爻行 */
.y-list{display:flex;flex-direction:column}
.y-row{
  display:grid;
  grid-template-columns:20px 30px 46px 1fr 52px 62px 34px 18px;
  gap:6px;align-items:center;
  padding:6px 2px;border-top:1px solid var(--line);
}
.y-row:first-child{border-top:none}
.y-row.dong{background:#FCFAFA}
.y-row.kong{color:var(--muted)}
.y-idx{font-size:10px;color:var(--muted);text-align:center;letter-spacing:0}
.y-ls{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:0}
.y-gz{font-family:"Songti SC","STSong","SimSun",serif;font-size:13.5px;font-weight:600;letter-spacing:0;white-space:nowrap;text-align:center}
.y-line{display:flex;align-items:center;justify-content:center;position:relative}
.bar-y{width:44px;height:7px;background:var(--ink);border-radius:1px}
.bar-n{width:44px;height:7px;display:flex;gap:6px}
.bar-n i{flex:1;background:var(--ink);border-radius:1px}
.dong-mark{position:absolute;right:-2px;top:-9px;font-size:10px;color:var(--red);line-height:1}
.y-lq{font-size:13px;letter-spacing:1px;white-space:nowrap;text-align:right;padding-right:4px}
.y-ws{font-size:11px;color:var(--muted);text-align:center}
.y-ws.w{color:var(--red)}
.y-sy{font-size:11px;color:var(--ink2);text-align:center;font-weight:600}
/* 伏神 */
.y-fu{
  display:flex;gap:6px;align-items:center;padding:3px 2px 5px 52px;
  font-size:11px;color:var(--muted);border-top:1px dashed var(--line);
}
.y-fu .tagv{font-size:9.5px;border:1px solid var(--line2);border-radius:2px;padding:0 3px;line-height:1.3;color:var(--ink2)}
.y-fu em{font-style:normal;font-family:"Songti SC","STSong","SimSun",serif;color:var(--ink2);letter-spacing:0}
.y-mark{vertical-align:1px;font-size:9.5px;border:1px solid var(--line2);border-radius:2px;padding:0 2px;line-height:1.3;color:var(--muted);margin-left:2px}
.y-mark.k{border-color:var(--ink);color:var(--ink)}

/* 图例 / 页脚 */
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:16px;font-size:11px;color:var(--ink2)}
.foot{margin-top:16px;padding:14px 0 24px;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);line-height:1.9}

@media (max-width:560px){
  .wrap{padding:20px 14px 0}
  h1{font-size:19px;letter-spacing:3px}
  .gua-grid{grid-template-columns:1fr;gap:12px}
  .yao-pick{grid-template-columns:repeat(3,1fr)}
  .info{grid-template-columns:1fr 1fr}
  .coin-box{padding:12px;gap:10px}
  .coin{width:38px;height:38px;font-size:13px}
  .coin-acts{width:100%;justify-content:space-between}
  .y-row{grid-template-columns:16px 26px 40px 1fr 46px 54px 30px 16px;gap:4px;font-size:13px}
  .bar-y,.bar-n{width:36px}
  .y-fu{padding-left:46px}
}
</style>
</head>
<body>
<div class="wrap">

  <h1>浩然老师六爻排盘</h1>
  <p class="sub">火珠林法 · 京房易 · 卜筮正宗</p>
  <div class="hr"></div>

  <!-- ===== 起卦时间 ===== -->
  <div class="sec">
    <p class="sec-h">起卦时间</p>
    <div class="ctrl">
      <div class="grid3">
        <div class="field"><label>公历年</label><input type="number" id="gy" value="2026" min="1930" max="2070"></div>
        <div class="field"><label>公历月</label><input type="number" id="gm" value="11" min="1" max="12"></div>
        <div class="field"><label>公历日</label><input type="number" id="gd" value="16" min="1" max="31"></div>
      </div>
      <div class="field" style="margin-top:8px"><label>占时</label><select id="sc"></select></div>
      <div class="gz">
        <div class="gz-i"><b id="ngz">-</b><span>年柱</span></div>
        <div class="gz-i"><b id="yjz">-</b><span>月建</span></div>
        <div class="gz-i"><b id="rgz">-</b><span>日辰</span></div>
        <div class="gz-i"><b id="sgz">-</b><span>时柱</span></div>
      </div>
    </div>
  </div>

  <!-- ===== 摇币 ===== -->
  <div class="sec">
    <p class="sec-h">摇卦 · 三枚铜钱</p>
    <div class="coin-box">
      <div class="coins" id="coinDisplay">
        <div class="coin">字</div><div class="coin">字</div><div class="coin">字</div>
      </div>
      <div class="coin-info">
        <div class="coin-line1" id="coinProgress">第 0 / 6 爻</div>
        <div class="coin-line2" id="coinResult">字为阴 · 背为阳，自初爻摇起</div>
      </div>
      <div class="coin-acts">
        <button class="btn" id="coinBtn" onclick="tossCoin()">摇 币</button>
        <button class="btn btn-ghost" onclick="resetCoins()">重摇</button>
      </div>
    </div>
  </div>

  <!-- ===== 手动装卦 ===== -->
  <div class="sec">
    <p class="sec-h">手动画爻 · 自初爻起</p>
    <div class="yao-pick" id="yaoInput"></div>
    <button class="btn btn-main" onclick="run()">排 盘</button>
  </div>

  <!-- ===== 结果 ===== -->
  <div class="sec" id="outWrap" style="display:none">
    <p class="sec-h">卦盘</p>
    <div id="out"></div>
    <div class="legend">
      <span>世 / 应：卦身之位</span>
      <span>○ ×：动爻（○老阳变阴 · ×老阴变阳）</span>
      <span>空：旬空</span>
      <span>冲：日辰相冲</span>
      <span>伏神：本宫首卦伏藏之爻</span>
    </div>
  </div>

  <div class="foot">
    月建按真实节气交接时刻判定，日辰以 1949-10-01 甲子日推<br>
    浩然老师（zhaohaoran）六爻排盘 · 依据卜筮正宗 · 仅供研习参考
  </div>
</div>

const JIE_ZHI=(function(){ // 小寒→丑, 立春→寅 ... 大雪→子
  const a=[]; for(let i=0;i<12;i++) a.push((i+1)%12); return a;
})();
const JIE_LIST=(function(){
  const out=[];
  JIE_RAW.split(';').forEach(function(row){
    if(!row) return;
    const p=row.split(':'), y=+p[0], ts=p[1].split(',');
    for(let i=0;i<12;i++) out.push({t:+ts[i], y:y, z:JIE_ZHI[i]});
  });
  out.sort(function(a,b){return a.t-b.t;});
  return out;
})();

/* 年柱：以立春交接时刻为界 */
function yearGZ(y,m,d,ts){
  let yy=y;
  const lc=(function(){
    const row=JIE_LIST.find(function(o){return o.y===y && o.z===2;});
    return row?row.t:null;
  })();
  if(lc!==null){ if(ts<lc) yy=y-1; }
  else if(m<2||(m===2&&d<4)) yy=y-1;
  return {g:((yy-4)%10+10)%10, z:((yy-4)%12+12)%12, year:yy};
}

/* 月建：取当前时刻之前最近的节 */
function yueJian(ts){
  let lo=0, hi=JIE_LIST.length-1, ans=-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(JIE_LIST[mid].t<=ts){ ans=mid; lo=mid+1; } else { hi=mid-1; }
  }
  if(ans<0) return {z:0, exact:false};
  return {z:JIE_LIST[ans].z, exact:JIE_LIST[ans].t, yuan:JIE_LIST[ans].y};
}

/* 日柱：1949-10-01 甲子日 */
function dayGZ(y,m,d){
  const base=Date.UTC(1949,9,1);
  const t=Date.UTC(y,m-1,d);
  const diff=Math.round((t-base)/86400000);
  return {g:((diff%10)+10)%10, z:((diff%12)+12)%12};
}

/* 时柱：甲己起甲子，乙庚起丙子，丙辛起戊子，丁壬起庚子，戊癸起壬子 */
function shiGZ(dayGan, sc){
  /* 甲己日甲子起，乙庚日丙子起，丙辛日戊子起，丁壬日庚子起，戊癸日壬子起 */
  const start=2*(dayGan%5);
  return {g:(start+sc)%10, z:sc};
}

/* ===== 五行 / 六亲 ===== */
function liuqin(gongWx, yaoWx){
  if(gongWx===yaoWx) return '兄弟';
  if(SHENG[gongWx]===yaoWx) return '子孙';
  if(KE[gongWx]===yaoWx) return '妻财';
  if(SHENG[yaoWx]===gongWx) return '父母';
  if(KE[yaoWx]===gongWx) return '官鬼';
  return '';
}
function lsStart(rigan){
  const i=GAN_NAMES.indexOf(rigan);
  if(i<=1) return 0; if(i<=3) return 1; if(i===4) return 2;
  if(i===5) return 3; if(i<=7) return 4; return 5;
}
function kongWang(rigan, rizhi){
  const gi=GAN_NAMES.indexOf(rigan), zi=ZHI_IDX[rizhi];
  const xun=(zi-gi+12)%12;
  return [ZHI_NAMES[(xun+10)%12], ZHI_NAMES[(xun+11)%12]];
}
function wangShuai(yaoWx, yueWx){
  if(yaoWx===yueWx) return {l:'旺',w:true};
  if(SHENG[yueWx]===yaoWx) return {l:'相',w:true};
  if(SHENG[yaoWx]===yueWx) return {l:'休',w:false};
  if(KE[yueWx]===yaoWx) return {l:'囚',w:false};
  if(KE[yaoWx]===yueWx) return {l:'死',w:false};
  return {l:'',w:false};
}

/* ===== 伏神：缺六亲时，取本宫首卦中该六亲之爻，伏于同爻位 ===== */
const PURE_KEY={乾:'111111',震:'100100',坎:'010010',艮:'001001',坤:'000000',巽:'011011',离:'101101',兑:'110110'};
function fuShen(benGua, benLq){
  const pure=GUA[PURE_KEY[benGua.gong]];
  if(!pure) return {};
  const pureLq=pure.najia.map(function(n){ return liuqin(benGua.gongWx, DZWX[n[1]]); });
  const has={}; benLq.forEach(function(x){ has[x]=1; });
  const out={};
  LIUQIN_ALL.forEach(function(lq){
    if(has[lq]) return;                       // 六亲不缺，不列伏神
    for(let i=0;i<6;i++){
      if(pureLq[i]===lq){                     // 取本宫首卦中该六亲最低爻位
        out[i]={lq:lq, gan:pure.najia[i][0], zhi:pure.najia[i][1], wx:DZWX[pure.najia[i][1]]};
        break;
      }
    }
  });
  return out;
}

/* 输入时刻 → 时间戳（按北京墙钟当作 UTC 秒，规避时区） */
function stamp(y,mo,d,h){
  return Date.UTC(y,mo-1,d,h,0,0)/1000;
}

function autoCalc(){
  const y=+el.gy.value, m=+el.gm.value, d=+el.gd.value, sc=+el.sc.value;
  if(!y||!m||!d) return;
  const ts=stamp(y,m,d,sc*2);
  const yGZ=yearGZ(y,m,d,ts), dGZ=dayGZ(y,m,d), sGZ=shiGZ(dGZ.g,sc);
  const yj=yueJian(ts);
  el.ngz.textContent=GAN_NAMES[yGZ.g]+ZHI_NAMES[yGZ.z];
  el.yjz.textContent=ZHI_NAMES[yj.z];
  el.rgz.textContent=GAN_NAMES[dGZ.g]+ZHI_NAMES[dGZ.z];
  el.sgz.textContent=GAN_NAMES[sGZ.g]+ZHI_NAMES[sGZ.z];
}
['gy','gm','gd','sc'].forEach(function(id){

        '<div class="gua-b">'+
          '<div class="gua-sub">'+benGua.gong+'宫 · '+benGua.shiLabel+' · 世在'+yaoNames[benGua.shi]+'</div>'+
          '<div class="y-list">'+benHtml+'</div>'+
        '</div>'+
      '</div>'+
      (anyDong&&bianGua?
      '<div class="gua">'+
        '<div class="gua-h"><span class="gt">变 卦</span><span class="gn">'+bianTitle+'</span></div>'+
        '<div class="gua-b">'+
          '<div class="gua-sub">'+bianMeta+'</div>'+
          '<div class="y-list">'+bianHtml+'</div>'+
        '</div>'+
      '</div>'
      :'')+
    (anyDong&&bianGua?'':'<div class="gua-note">六爻安静，无变卦，以本卦断之。</div>')+
    '</div>';

  el.outWrap.style.display='';
}

/* ===== 摇币起卦 ===== */
let coinCount=0, tossing=false;
const COIN_RESULT={'0':'少阳 ──','1':'少阴 ─ ─','2':'老阳 ── ○','3':'老阴 ─ ─ ×'};

function tossCoin(){
  if(tossing) return;
  if(coinCount>=6){ alert('六爻已摇完，欲再占请点「重摇」'); return; }
  tossing=true; el.coinBtn.disabled=true;
  el.progress.textContent='正在摇第 '+(coinCount+1)+' 爻……';
  el.coinResult.textContent='';
  Array.from(document.querySelectorAll('#coinDisplay .coin')).forEach(function(c){
    c.textContent=''; c.className='coin'; void c.offsetWidth; c.classList.add('spin');
  });
  setTimeout(function(){
    const backs=[Math.random()<0.5, Math.random()<0.5, Math.random()<0.5];
    const n=backs.filter(Boolean).length;
    const v=(n+3)%4;
    const coins=document.querySelectorAll('#coinDisplay .coin');
    backs.forEach(function(b,i){
      coins[i].textContent=b?'背':'字';
      coins[i].className='coin '+(b?'bei':'');
    });
    document.getElementById('y'+coinCount).value=v;
    coinCount++;
    el.progress.textContent='第 '+coinCount+' / 6 爻';
    el.coinResult.textContent=yaoNames[coinCount-1]+'：'+COIN_RESULT[v];
    if(coinCount===6){
      el.coinResult.textContent='六爻已成，已排盘';
      run();
    }
    tossing=false; el.coinBtn.disabled=false;
  },520);
}

function resetCoins(){
  if(tossing) return;
  if(coinCount===0) return;
  if(!confirm('已摇 '+coinCount+' 爻，确定重摇？')) return;
  coinCount=0;
  el.progress.textContent='第 0 / 6 爻';
  el.coinResult.textContent='字为阴 · 背为阳，自初爻摇起';
  Array.from(document.querySelectorAll('#coinDisplay .coin')).forEach(function(c){
    c.textContent='字'; c.className='coin';
  });
}

autoCalc();
run();

</script>
