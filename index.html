<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="zhaohaoran（浩然老师）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' fill='%23FFFFFF' stroke='%23161616' stroke-width='6'/%3E%3Cpath d='M20 38h60M20 62h60' stroke='%23161616' stroke-width='7'/%3E%3C/svg%3E">
<title>浩然六爻纳甲排盘</title>
<style>
:root{
  --ink:#161616; --ink2:#4A4A4A; --muted:#8C8C8C;
  --line:#E8E8E8; --line2:#CFCFCF; --soft:#FAFAFA; --red:#B3261E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#fff;color:var(--ink);-webkit-text-size-adjust:100%;
}
.wrap{max-width:700px;margin:0 auto;padding:26px 18px 0}

/* 标题 */
h1{font-size:22px;font-weight:700;letter-spacing:4px;text-align:center}
.sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-align:center;margin-top:7px}
.hr{height:1px;background:var(--line2);margin:16px 0 0}

/* 段落标题 */
.sec{margin-top:18px}
.sec-h{font-size:11.5px;color:var(--muted);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* 输入 */
.ctrl{margin-top:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.grid-dt{grid-template-columns:1fr 1fr 1fr 1.5fr}
.grid-dt select{font-size:15px;padding:0 4px;text-align:center;text-align-last:center}
.grid-dt input{padding:0 4px}
.field{min-width:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:1px}
input,select{
  width:100%;height:42px;border:1px solid var(--line2);border-radius:3px;background:#fff;
  color:var(--ink);font-size:16px;font-family:inherit;padding:0 8px;text-align:center;
  -webkit-appearance:none;appearance:none;
}
select{text-align:left}
input:focus,select:focus{outline:none;border-color:var(--ink)}

/* 干支 */
.gz{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.gz-i{display:flex;flex-direction:column;gap:3px;min-width:0}
.gz-i b{font-size:16px;font-weight:600;letter-spacing:1px}
.gz-i span{font-size:10.5px;color:var(--muted);letter-spacing:1px}

/* 摇币 */
.coin-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;border:1px solid var(--line);border-radius:4px;padding:14px}
.coins{display:flex;gap:10px}
.coin{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink);
  user-select:none;transition:background .15s,color .15s,border-color .15s;
}
.coin.bei{background:var(--ink);color:#fff;border-color:var(--ink)}
.coin.spin{animation:spin .55s ease}
@keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.coin-info{flex:1 1 180px;min-width:0}
.coin-line1{font-size:13px;color:var(--ink2);letter-spacing:.5px}
.coin-line2{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.coin-acts{display:flex;gap:8px;align-items:center}

/* 按钮 */
.btn{
  height:42px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-size:15px;font-family:inherit;letter-spacing:3px;border-radius:3px;cursor:pointer;
}
.btn:hover{background:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--ink2);border-color:var(--line2);letter-spacing:1px}
.btn-ghost:hover{background:var(--soft);color:var(--ink)}
.btn-main{width:100%;height:46px;font-size:16px;letter-spacing:8px;margin-top:12px}

/* 手动画爻 */
.yao-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.yp{
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;
  border:1px solid var(--line2);border-radius:3px;background:#fff;padding:7px 4px 6px;
  transition:border-color .15s;
}
.yp:focus-within{border-color:var(--ink)}
.yp label{font-size:12px;color:var(--muted);text-align:center;letter-spacing:2px;line-height:1.4}
.yp select{
  width:100%;height:30px;border:none;border-radius:0;background:transparent;
  font-size:15px;font-weight:600;letter-spacing:1px;padding:0;text-align:center;text-align-last:center;
}
.yp select:focus{border:none}

/* 结果 */
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:10px;border-top:1px solid var(--line)}
.info div{display:flex;gap:8px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.info div span{font-size:11px;color:var(--muted);letter-spacing:1px;flex:0 0 auto}
.info div b{font-size:14px;font-weight:600;letter-spacing:.5px}

.gua-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.gua-grid.one{grid-template-columns:1fr}
.gua-note{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.5px}
.gua{border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.gua-h{padding:10px 12px 9px;border-bottom:1px solid var(--line);position:relative;text-align:center}
.gua-h .gt{position:absolute;left:12px;top:11px;font-size:10.5px;color:var(--muted);letter-spacing:2px}
.gua-h .gn{font-family:"Songti SC","STSong","SimSun",serif;font-size:17px;font-weight:700;letter-spacing:1px}
.gua-b{padding:8px 10px 10px}
.gua-sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px}

/* 卦盘：本卦 / 变卦 横向对照 */
.pan{border:1px solid var(--line2);border-radius:4px;overflow:hidden;margin-top:14px}
.pan-h{padding:11px 12px 10px;border-bottom:1px solid var(--line);text-align:center}
.pan-h .pn{font-family:"Songti SC","STSong","SimSun",serif;font-size:18px;font-weight:700;letter-spacing:1px}
.pan-h .pn i{font-style:normal;color:var(--red);font-size:13px;letter-spacing:2px;margin:0 8px}
.pan-h .ps{font-size:10.5px;color:var(--muted);letter-spacing:.8px;margin-top:4px}
.pan-c{
  display:grid;grid-template-columns:17px 15px 1fr 1fr 15px;gap:7px;align-items:center;
  padding:5px 9px;font-size:9.5px;color:var(--muted);letter-spacing:2px;
  text-align:center;border-bottom:1px solid var(--line);background:var(--soft);
}
.pan-c .c2,.pan-c .c3{justify-self:center;padding:0}
.ly{
  display:grid;grid-template-columns:17px 15px 1fr 1fr 15px;gap:7px;align-items:center;
  padding:6px 9px;border-bottom:1px solid var(--line);min-height:38px;
}
.ly:last-of-type{border-bottom:none}
.ly.dong{background:#FCF9F8}
.ly .c2,.ly .c3{display:flex;align-items:center;gap:5px;min-width:0}
.ly .c2{justify-content:flex-end;border-right:1px solid var(--line);padding-right:8px}
.ly .c3{justify-content:flex-start;padding-left:8px}
.pan-one .pan-c,.pan-one .ly{grid-template-columns:17px 15px 1fr 15px}
.pan-one .pan-c .c3,.pan-one .ly .c3{display:none}
.pan-one .ly .c2{justify-content:center;border-right:none}
.ly-idx{font-size:11px;color:var(--muted);text-align:center;letter-spacing:1px}
.ly-ls{font-size:12px;color:var(--ink2);text-align:center;letter-spacing:0}
.ly-sy{font-size:11px;color:var(--red);text-align:center;font-weight:700;letter-spacing:0}
.c-lq{font-size:12.5px;color:var(--ink2);letter-spacing:.3px;white-space:nowrap;flex:0 0 auto}
.c-z{font-family:"Songti SC","STSong","SimSun",serif;font-size:18px;font-weight:700;letter-spacing:0;flex:0 0 auto}
.c-line{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40px}
.bar-y{width:40px;height:7px;background:var(--ink);border-radius:1px}
.bar-n{width:40px;height:7px;display:flex;gap:5px}
.bar-n i{flex:1;background:var(--ink);border-radius:1px}
.dong-mark{position:absolute;right:0;top:-7px;font-size:10px;color:var(--red);line-height:1}
/* 圈注：月破 / 日冲 / 旬空 */
.mk{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;margin-left:2px}
.mk i{
  display:flex;align-items:center;justify-content:center;
  width:15px;height:15px;border-radius:50%;border:1px solid var(--red);
  color:var(--red);font-size:9px;font-style:normal;line-height:1;letter-spacing:0;
}
.c-quiet .c-lq{color:var(--muted)}
.c-quiet .c-z{color:var(--muted)}
.c-quiet .bar-y,.c-quiet .bar-n i{background:#BDBDBD}
/* 伏神 */
.fu-line{display:grid;grid-template-columns:17px 15px 1fr 1fr 15px;gap:7px;padding:0 9px 6px;font-size:11px;color:var(--muted)}
.fu-in{grid-column:3;justify-self:end;display:flex;align-items:center;gap:4px}
.pan-one .fu-line{grid-template-columns:17px 15px 1fr 15px}
.pan-one .fu-in{grid-column:3;justify-self:center}
.fu-tag{font-size:9px;border:1px dashed var(--line2);border-radius:2px;padding:0 3px;line-height:1.3;color:var(--muted)}
.fu-line em{font-style:normal;font-family:"Songti SC","STSong","SimSun",serif;letter-spacing:0;color:var(--ink2)}

/* 测事 / 断语 */
.note{margin-top:12px;border:1px solid var(--line2);border-radius:4px;padding:12px 13px 13px}
.note label{display:block;font-size:11px;color:var(--muted);letter-spacing:1.5px;margin-bottom:5px}
.note input{
  width:100%;height:40px;border:1px solid var(--line2);border-radius:3px;background:#fff;
  color:var(--ink);font-size:15px;font-family:inherit;padding:0 9px;text-align:left;
}
.note textarea{
  width:100%;min-height:96px;border:1px solid var(--line2);border-radius:3px;background:#fff;
  color:var(--ink);font-size:15px;font-family:inherit;line-height:1.7;padding:9px;resize:vertical;
  margin-top:10px;
}
.note input:focus,.note textarea:focus{outline:none;border-color:var(--ink)}
.note-acts{display:flex;gap:10px;margin-top:10px}
.note-acts .btn{height:38px;font-size:13.5px;letter-spacing:2px;flex:1 1 0;padding:0 10px}
.note-tip{font-size:10.5px;color:var(--muted);margin-top:8px;letter-spacing:.5px}
.hist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hist-i{border-bottom:1px solid var(--line);padding:8px 0;font-size:12px;line-height:1.7}
.hist-i:last-child{border-bottom:none}
.hist-i .hm{color:var(--muted);font-size:10.5px;letter-spacing:.5px}
.hist-i .ha{color:var(--ink);font-weight:600}
.hist-i .hs{color:var(--ink2);margin-top:3px;white-space:pre-wrap}
.hist-i .del{float:right;font-size:10.5px;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;padding:0 2px}
.hist-empty{font-size:11.5px;color:var(--muted);padding:6px 0}

/* 图例 / 页脚 */
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:16px;font-size:11px;color:var(--ink2)}
.foot{margin-top:16px;padding:14px 0 24px;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);line-height:1.9}

@media (max-width:560px){
  .wrap{padding:20px 14px 0}
  h1{font-size:19px;letter-spacing:3px}
  .yao-pick{grid-template-columns:repeat(3,1fr);gap:8px}
  .yp{padding:8px 4px 7px}
  .yp select{height:32px;font-size:16px}
  .info{grid-template-columns:1fr 1fr}
  .coin-box{padding:12px;gap:10px}
  .coin{width:38px;height:38px;font-size:13px}
  .coin-acts{width:100%;justify-content:flex-start;gap:10px}
  .coin-acts .btn{flex:1 1 0;padding:0 10px}
  .ly{grid-template-columns:15px 13px 1fr 1fr 13px;gap:5px;padding:6px 7px}
  .pan-c{grid-template-columns:15px 13px 1fr 1fr 13px;gap:5px;padding:5px 7px}
  .fu-line{grid-template-columns:15px 13px 1fr 1fr 13px;gap:5px;padding:1px 7px 5px}
  .c-line{width:36px}
  .bar-y,.bar-n{width:36px}
  .c-lq{font-size:11.5px}
  .c-z{font-size:17px}
  .note{padding:11px 11px 12px}
}
</style>
</head>
<body>
<div class="wrap">

  <h1>浩然六爻纳甲排盘</h1>
  <p class="sub">火珠林法 · 京房易 · 卜筮正宗</p>
  <div class="hr"></div>

  <!-- ===== 起卦时间 ===== -->
  <div class="sec">
    <p class="sec-h">起卦时间</p>
    <div class="ctrl">
      <div class="grid3 grid-dt">
        <div class="field"><label>公历年</label><input type="number" id="gy" value="2026" min="1930" max="2070"></div>
        <div class="field"><label>公历月</label><input type="number" id="gm" value="11" min="1" max="12"></div>
        <div class="field"><label>公历日</label><input type="number" id="gd" value="16" min="1" max="31"></div>
        <div class="field"><label>占时</label><select id="sc"></select></div>
      </div>
      <div class="gz">
        <div class="gz-i"><b id="ngz">-</b><span>年柱</span></div>
        <div class="gz-i"><b id="yjz">-</b><span>月建</span></div>
        <div class="gz-i"><b id="rgz">-</b><span>日辰</span></div>
        <div class="gz-i"><b id="sgz">-</b><span>时柱</span></div>
      </div>
    </div>
  </div>

  <!-- ===== 摇币 ===== -->
  <div class="sec">
    <p class="sec-h">摇卦 · 三枚铜钱</p>
    <div class="coin-box">
      <div class="coins" id="coinDisplay">
        <div class="coin">字</div><div class="coin">字</div><div class="coin">字</div>
      </div>
      <div class="coin-info">
        <div class="coin-line1" id="coinProgress">第 0 / 6 爻</div>
        <div class="coin-line2" id="coinResult">字为阴 · 背为阳，自初爻摇起</div>
      </div>
      <div class="coin-acts">
        <button class="btn" id="coinBtn" onclick="tossCoin()">摇 币</button>
        <button class="btn btn-ghost" onclick="resetCoins()">重摇</button>
      </div>
    </div>
  </div>

  <!-- ===== 手动装卦 ===== -->
  <div class="sec">
    <p class="sec-h">手动画爻 · 自初爻起</p>
    <div class="yao-pick" id="yaoInput"></div>
    <button class="btn btn-main" onclick="run()">排 盘</button>
  </div>

  <!-- ===== 结果 ===== -->
  <div class="sec" id="outWrap" style="display:none">
    <p class="sec-h">卦盘</p>
    <div id="out"></div>
    <div class="legend">
      <span>世 / 应：卦身之位</span>
      <span>○ ×：动爻（○老阳变阴 · ×老阴变阳）</span>
      <span>红圈：破 月建相冲 · 冲 日辰相冲 · 空 旬空</span>
    </div>

    <div class="note">
      <label>所测何事</label>
      <input id="noteAsk" placeholder="如：问工作调动、求财、婚姻……" maxlength="60">
      <textarea id="noteSay" placeholder="断语：写下你的判断与应期……" maxlength="2000"></textarea>
      <div class="note-acts">
        <button class="btn" onclick="saveNote()">保 存</button>
        <button class="btn btn-ghost" onclick="toggleHist()">历史 <span id="histCnt">0</span></button>
      </div>
      <p class="note-tip" id="noteTip">本卦内容会自动暂存，刷新后同一卦可直接续写。</p>
      <div class="hist" id="histBox" style="display:none"></div>
    </div>
  </div>

  <div class="foot">
    月建按真实节气交接时刻判定，日辰以 1949-10-01 甲子日推<br>
    浩然六爻纳甲排盘 · 依据卜筮正宗 · 仅供研习参考
  </div>
</div>
<script src="jie1.js"></script>
<script src="jie2.js"></script>
<script src="jie3.js"></script>
<script src="jie4.js"></script>
<script src="jie_all.js"></script>
<script src="data_gua.js"></script>
<script src="app.js"></script>
</body>
</html>
